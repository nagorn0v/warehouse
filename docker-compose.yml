include:
  - docker-compose.infra.yml

services:
  # REST API: приём данных, запись в postgres-inventory, публикация событий в Redis
  inventory_api:
    build:
      context: ./inventory_api
    container_name: warehouse-inventory-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@postgres-inventory:5432/${INVENTORY_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      WAIT_FOR_HOSTS: postgres-inventory:5432 redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - warehouse-net

  # Worker: слушает Redis Streams, агрегирует события в postgres-analytics (кэш)
  analytics_worker:
    build:
      context: ./analytics_worker
    container_name: warehouse-analytics-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@postgres-analytics:5432/${ANALYTICS_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CONSUMER_GROUP: ${CONSUMER_GROUP}
      CONSUMER_NAME: ${CONSUMER_NAME}
      BATCH_SIZE: ${BATCH_SIZE}
      BLOCK_MS: ${BLOCK_MS}
      WAIT_FOR_HOSTS: postgres-analytics:5432 redis:6379
    depends_on:
      postgres-analytics:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - warehouse-net
